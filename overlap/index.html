      var mine=v.me===r.id;
      return '<div class="chip'+(mine?" me":"")+'">'
        +'<button class="chip-name" data-act="focus" data-id="'+r.id+'">'+esc(r.name)+(mine?" (you)":"")+'</button>'
        +'<span class="chip-n">'+r.slots.size+'</span>'
        +(mine?'<button class="chip-x" data-act="editmine">edit</button>':'<button class="chip-x" data-act="claim-existing" data-id="'+r.id+'">it’s me</button>')
        +'<button class="chip-x danger" data-act="remove" data-id="'+r.id+'" aria-label="Remove '+esc(r.name)+'">×</button>'
        +'</div>';
    }).join("");
    return '<div class="roster"><h3>Responses</h3>'
      +(R.length?'<div class="chips">'+chips+'</div>':'<p class="empty">No one has filled this in yet.</p>')
      +(v.me?'':'<p style="margin-top:14px"><button class="btn primary" data-tab="mine">＋ Add your availability</button></p>')
      +'</div>';
  }

  function groupHTML(s){
    var R=responses(s),total=R.length,mx=matrix(s,R),best=bestInfo(s,mx,R,total);
    var hl=null;
    if(v.focusId){var f=R.filter(function(r){return r.id===v.focusId})[0];if(f)hl=f.slots}
    var focusName=v.focusId?(R.filter(function(r){return r.id===v.focusId})[0]||{}).name:null;
    return gridHTML(s,{interactive:false,mx:mx,total:total,best:best,highlight:hl})
      +'<div class="inspector" data-role="inspector">'+(focusName?('Showing <strong>'+esc(focusName)+'</strong>’s availability. Hover any slot for details.'):'Hover or focus a slot to see who’s free.')+'</div>'
      +'<div class="legend"><span class="sw"><span class="box" style="background:var(--surface)"></span>0</span>'
      +'<span class="sw"><span class="box" style="background:color-mix(in srgb,var(--fill) 37%,var(--surface))"></span>some</span>'
      +'<span class="sw"><span class="box" style="background:color-mix(in srgb,var(--fill) 74%,var(--surface))"></span>all</span>'
      +'<span class="sw"><span class="box" style="border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)"></span>best overlap</span></div>'
      +resultsHTML(best,total)
      +rosterHTML(s,R);
  }

  function mineHTML(s){
    if(!v.me){
      return '<form class="claim" data-act="claim">'
        +'<label for="nm">Your name</label>'
        +'<input id="nm" name="nm" type="text" required maxlength="40" autocomplete="name" placeholder="e.g. Priya">'
        +'<p style="margin:14px 0 0"><button class="btn primary" type="submit">Start marking availability</button></p>'
        +'</form>'
        +'<p class="hint" style="margin-top:18px">You’ll paint the hours you’re free on the grid, then save. Everyone with the link sees the combined picture.</p>';
    }
    var sel=v.draft||new Set();
    return '<p class="hint" style="margin-bottom:14px">Click or drag across the hours you’re available, then save.</p>'
      +gridHTML(s,{interactive:true,selected:sel})
      +'<div class="actionbar">'
      +'<span class="who">Marking availability as <b>'+esc(v.myName||"you")+'</b></span>'
      +'<span id="draftcount">'+sel.size+' hrs</span>'
      +'<span class="spacer"></span>'
      +'<button class="btn ghost" data-act="cleardraft" type="button">Clear</button>'
      +'<button class="btn ghost" data-act="cancelmine" type="button">Cancel</button>'
      +'<button class="btn primary" data-act="savemine" type="button">Save availability</button>'
      +'</div>';
  }

  function setupHTML(s){
    var c=v.setup;
    var hopt=function(sel){var o="";for(var i=0;i<=24;i++){o+='<option value="'+i+'"'+(i===sel?" selected":"")+'>'+fmtHour(i)+(i===24?" (next day)":"")+'</option>'}return o};
    var tags=c.days.map(function(d){return '<span class="dtag">'+esc(wd(d)+" "+md(d))+' <button class="chip-x" data-act="delday" data-day="'+d+'" aria-label="Remove day">×</button></span>'}).join("");
    return '<div class="setup">'
      +'<div class="row"><label for="f-title">Event name</label><input id="f-title" data-field="title" type="text" maxlength="80" value="'+esc(c.title)+'"></div>'
      +'<div class="row"><label for="f-tz">Time zone label</label><input id="f-tz" data-field="tz" type="text" maxlength="40" value="'+esc(c.tz)+'"></div>'
      +'<div class="row"><label for="f-note">Note (optional)</label><input id="f-note" data-field="note" type="text" maxlength="140" value="'+esc(c.note||"")+'"></div>'
      +'<div class="row"><label>Hours shown</label><div class="hours"><select data-field="startHour" aria-label="Start hour">'+hopt(c.startHour)+'</select><span class="hint">to</span><select data-field="endHour" aria-label="End hour">'+hopt(c.endHour)+'</select></div></div>'
      +'<div class="row"><label>Days</label><div class="daylist">'+(tags||'<span class="hint">No days yet.</span>')+'</div>'
      +'<div class="adder"><input type="date" data-role="newday" aria-label="New day"><button class="btn" data-act="addday" type="button">Add day</button></div></div>'
      +'<div class="setup-actions"><button class="btn primary" data-act="setup-save" type="button">Save changes</button>'
      +'<button class="btn ghost" data-act="setup-discard" type="button">Discard</button>'
      +'<span class="spacer"></span>'
      +'<button class="btn ghost" data-act="fresh" type="button" style="color:var(--danger)">Start fresh</button></div>'
      +'</div>';
  }

  function bodyHTML(s){
    var R=responses(s),total=R.length,mx=matrix(s,R),best=bestInfo(s,mx,R,total);
    var pane=v.mode==="setup"?setupHTML(s):v.mode==="mine"?mineHTML(s):groupHTML(s);
    var savenote=v.busy?'<span class="dot"></span><span class="saving">saving…</span>':(cap===null?'<span class="dot"></span><span>local only</span>':"");
    return '<div class="wrap'+(v.busy?" busy":"")+'">'
      +'<header class="masthead">'
      +'<p class="kicker">Group availability</p>'
      +'<h1>'+esc(s.title)+'</h1>'
      +'<p class="meta"><span>'+esc(s.tz)+'</span><span class="dot"></span><span>'+total+' '+(total===1?"response":"responses")+'</span><span class="dot"></span><span>'+s.days.length+' days · '+esc(fmtHour(s.startHour))+'–'+esc(fmtHour(s.endHour))+'</span></p>'
      +(s.note?'<p class="note-line">'+esc(s.note)+'</p>':'')
      +'</header>'
      +(s.example?'<div class="banner">Example event — edit anything inline, or <button class="linkbtn" data-act="fresh">start fresh</button> to clear it and plan your own.</div>':'')
      +(v.roMsg?'<div class="banner ro">'+esc(v.roMsg)+'</div>':'')
      +'<section class="verdict">'+verdictHTML(best,total)+'</section>'
      +'<nav class="tabs">'
      +'<button data-tab="group" class="'+(v.mode==="group"?"sel":"")+'">Group view</button>'
      +'<button data-tab="mine" class="'+(v.mode==="mine"?"sel":"")+'">'+(v.me?"My availability":"Add availability")+'</button>'
      +'<button data-tab="setup" class="'+(v.mode==="setup"?"sel":"")+'">Event setup</button>'
      +'</nav>'
      +'<section class="panel">'+pane+'</section>'
      +'<footer class="foot"><span>v'+(s.version||1)+'</span><span class="dot"></span><span>updated '+esc(rel(s.updatedAt))+'</span>'+savenote+'</footer>'
      +'</div>';
  }

  function render(){
    var root=$("#root");
    root.innerHTML=bodyHTML(STATE);
    wire();
    if(v._scroll){window.scrollTo(0,v._scroll);v._scroll=0}
  }

  /* ---------- publish ---------- */
  function renderDoc(s){
    var json=JSON.stringify(s).replace(/</g,"\\u003c");
    var head=""
      +'<!doctype html>\n<html lang="en">\n<head>\n'
      +'<meta charset="utf-8">\n'
      +'<meta name="viewport" content="width=device-width, initial-scale=1">\n'
      +'<meta name="color-scheme" content="light dark">\n'
      +'<title>'+esc(s.title||"Overlap")+' — group availability</title>\n'
      +'<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'
      +'<link rel="stylesheet" href="'+FONT+'">\n'
      +'<style id="appstyle">'+STYLE_TEXT+'</style>\n</head>\n<body>\n';
    var tail='\n</body>\n</html>';
    return head
      +'<div id="root">'+bodyHTML(s)+'</div>\n'
      +'<script id="state" type="application/json">'+json+'<'+'/script>\n'
      +'<script id="appcode">'+CODE_TEXT+'<'+'/script>'
      +tail;
  }

  function commit(mutator,opts){
    if(v.busy)return;
    var next=JSON.parse(JSON.stringify(STATE));
    mutator(next);
    next.version=(STATE.version||1)+1;
    next.updatedAt=nowISO();

    if(!window.claude||!window.claude.use||cap===null){
      STATE=next;render();return;
    }
    v.busy=true;render();
    try{sessionStorage.setItem("ap:after",JSON.stringify({mode:(opts&&opts.mode)||"group",scrollY:window.scrollY}))}catch(e){}

    Promise.resolve(cap!==undefined?cap:window.claude.use("artifact")).then(function(c){
      cap=c;
      if(!c){v.busy=false;STATE=next;note("Sharing isn’t available here — saved to this screen only.");return}
      return c.publish(renderDoc(next)).then(function(){/* view reloads */});
    }).catch(function(e){
      v.busy=false;
      var code=e&&e.code;
      if(code==="conflict"){return;/* reloading to winner */}
      if(code==="not_writer"||code==="not_granted"||code==="not_declared"||code==="capability_disabled"||code==="consent_required"){
        STATE=next;note("This view is read-only — your change stays on this screen and isn’t shared.");return;
      }
      STATE=next;note("Couldn’t save ("+(code||"error")+"). Your change stays on this screen.");
    });
  }

  /* ---------- interaction ---------- */
  function freshFields(t){
    var base=new Date();var days=[];var add=0;
    while(days.length<3){var d=new Date(base.getTime()+add*86400000);var wday=d.getDay();if(wday!==0&&wday!==6)days.push(d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()));add++}
    return {title:t||"Untitled event",tz:"Local time",note:"",days:days,startHour:9,endHour:17,responses:[],example:false};
  }
  function cloneSetup(s){return {title:s.title,tz:s.tz,note:s.note||"",days:s.days.slice(),startHour:s.startHour,endHour:s.endHour}}
  function pruneSlots(s){
    var valid=new Set();
    s.days.forEach(function(d){range(s.startHour,s.endHour).forEach(function(hr){valid.add(d+"T"+hr)})});
    (s.responses||[]).forEach(function(r){r.slots=(r.slots||[]).filter(function(k){return valid.has(k)})});
  }

  function updateDraftCount(){
    var el=$("#draftcount");if(el&&v.draft)el.textContent=v.draft.size+" hrs";
  }

  function inspect(key){
    var el=$('[data-role="inspector"]');if(!el)return;
    if(!key){
      if(v.focusId){var f=responses(STATE).filter(function(r){return r.id===v.focusId})[0];if(f){el.innerHTML='Showing <strong>'+esc(f.name)+'</strong>’s availability. Hover any slot for details.';return}}
      el.innerHTML='Hover or focus a slot to see who’s free.';return;
    }
    var parts=key.split("T"),d=parts[0],hr=+parts[1];
    var R=responses(STATE);
    var free=R.filter(function(r){return r.slots.has(key)}).map(function(r){return r.name});
    var out=R.filter(function(r){return !r.slots.has(key)}).map(function(r){return r.name});
    el.innerHTML='<strong>'+esc(wd(d)+" "+md(d)+", "+fmtHour(hr))+'</strong> — '
      +(free.length?'<span class="ok">'+esc(free.join(", "))+'</span>':'<span class="muted">no one yet</span>')
      +(out.length?' · <span class="muted">out: '+esc(out.join(", "))+'</span>':'');
  }

  var painting=false,paintTo=true,suppressClick=false;

  function wire(){
    var root=$("#root");

    root.onclick=function(e){
      var tab=e.target.closest("[data-tab]");
      if(tab){switchTab(tab.getAttribute("data-tab"));return}
      var act=e.target.closest("[data-act]");
      if(!act)return;
      var a=act.getAttribute("data-act"),id=act.getAttribute("data-id");
      if(a==="claim")return; // the claim form is handled by its submit event
      handle(a,act,id);
    };

    root.onsubmit=function(e){
      var f=e.target.closest('form[data-act="claim"]');
      if(!f)return;
      e.preventDefault();
      var nm=(f.querySelector("[name=nm]").value||"").trim();
      if(!nm)return;
      v.me=uid();v.myName=nm;v.draft=new Set();
      lsSet("ap:me",v.me);lsSet("ap:name",nm);
      v.mode="mine";render();
    };

    root.oninput=function(e){
      var fld=e.target.closest("[data-field]");
      if(fld&&v.setup){
        var k=fld.getAttribute("data-field");
        v.setup[k]=(k==="startHour"||k==="endHour")?+fld.value:fld.value;
      }
    };

    // grid paint (mine)
    var grid=root.querySelector(".grid");
    if(grid&&v.mode==="mine"){
      grid.addEventListener("pointerdown",function(e){
        var c=e.target.closest(".cell.mine");if(!c)return;
        painting=true;paintTo=!c.classList.contains("on");suppressClick=true;
        applyPaint(c);
        try{c.setPointerCapture(e.pointerId)}catch(_){}
        e.preventDefault();
      });
      grid.addEventListener("pointerover",function(e){
        if(!painting)return;var c=e.target.closest(".cell.mine");if(c)applyPaint(c);
      });
      grid.addEventListener("click",function(e){
        var c=e.target.closest(".cell.mine");if(!c)return;
        if(suppressClick){suppressClick=false;return}
        painting=false;paintTo=!c.classList.contains("on");applyPaint(c);
      });
    }
    if(grid&&v.mode==="group"){
      grid.addEventListener("pointerover",function(e){var c=e.target.closest(".cell[data-key]");if(c){v.lastKey=c.getAttribute("data-key");inspect(v.lastKey)}});
      grid.addEventListener("focusin",function(e){var c=e.target.closest(".cell[data-key]");if(c){v.lastKey=c.getAttribute("data-key");inspect(v.lastKey)}});
      grid.addEventListener("pointerleave",function(){inspect(null)});
    }
  }
  window.addEventListener("pointerup",function(){painting=false});

  function applyPaint(c){
    var k=c.getAttribute("data-key");
    if(paintTo){v.draft.add(k);c.classList.add("on");c.setAttribute("aria-pressed","true")}
    else{v.draft.delete(k);c.classList.remove("on");c.setAttribute("aria-pressed","false")}
    updateDraftCount();
  }

  function switchTab(tab){
    if(v.mode==="mine"&&tab!=="mine"&&v.draft&&v.me){
      // silently drop unsaved paint when leaving; it's cheap to redo
    }
    v.mode=tab;
    if(tab==="mine"&&v.me){
      var r=(STATE.responses||[]).filter(function(x){return x.id===v.me})[0];
      v.draft=new Set(r?r.slots:[]);
      if(r&&!v.myName)v.myName=r.name;
    }
    if(tab==="setup")v.setup=cloneSetup(STATE);
    render();
  }

  function handle(a,el,id){
    if(a==="fresh"){
      if(!confirm("Clear this event and all responses, and start a new blank one?"))return;
      commit(function(n){var f=freshFields("Untitled event");for(var k in f)n[k]=f[k]});
      return;
    }
    if(a==="focus"){v.focusId=(v.focusId===id?null:id);render();return}
    if(a==="editmine"){switchTab("mine");return}
    if(a==="claim-existing"){
      v.me=id;
      var r=(STATE.responses||[]).filter(function(x){return x.id===id})[0];
      v.myName=r?r.name:"";
      lsSet("ap:me",id);lsSet("ap:name",v.myName);
      switchTab("mine");
      return;
    }
    if(a==="remove"){
      var rr=(STATE.responses||[]).filter(function(x){return x.id===id})[0];
      if(!confirm("Remove "+(rr?rr.name:"this response")+"?"))return;
      commit(function(n){n.responses=(n.responses||[]).filter(function(x){return x.id!==id})});
      if(id===v.me){v.me=null;v.myName="";lsSet("ap:me","");lsSet("ap:name","")}
      return;
    }
    if(a==="cleardraft"){
      v.draft=new Set();
      $$(".cell.mine.on").forEach(function(c){c.classList.remove("on");c.setAttribute("aria-pressed","false")});
      updateDraftCount();
      return;
    }
    if(a==="cancelmine"){v.mode="group";render();return}
    if(a==="savemine"){
      if(!v.me)return;
      var slots=Array.prototype.slice.call(v.draft).sort();
      var name=v.myName||"You";
      commit(function(n){
        n.responses=n.responses||[];
        var ex=n.responses.filter(function(x){return x.id===v.me})[0];
        if(ex){ex.slots=slots;ex.name=name;ex.updatedAt=nowISO()}
        else n.responses.push({id:v.me,name:name,slots:slots,updatedAt:nowISO()});
      },{mode:"group"});
      return;
    }
    if(a==="addday"){
      var inp=$('[data-role="newday"]');var val=inp&&inp.value;
      if(!val||!v.setup)return;
      if(v.setup.days.indexOf(val)<0){v.setup.days.push(val);v.setup.days.sort()}
      render();
      return;
    }
    if(a==="delday"){
      if(!v.setup)return;
      var d=el.getAttribute("data-day");
      v.setup.days=v.setup.days.filter(function(x){return x!==d});
      render();
      return;
    }
    if(a==="setup-discard"){v.setup=null;v.mode="group";render();return}
    if(a==="setup-save"){
      var c=v.setup;if(!c)return;
      if(!c.days.length){alert("Add at least one day.");return}
      if(c.endHour<=c.startHour){alert("End hour must be after start hour.");return}
      var title=(c.title||"").trim()||"Untitled event";
      commit(function(n){
        n.title=title;n.tz=(c.tz||"").trim()||"Local time";n.note=(c.note||"").trim();
        n.days=c.days.slice().sort();n.startHour=c.startHour;n.endHour=c.endHour;
        n.example=false;
        pruneSlots(n);
      },{mode:"group"});
      v.setup=null;
      return;
    }
  }

  /* ---------- boot ---------- */
  render();
})();
</script>

</body></html>
